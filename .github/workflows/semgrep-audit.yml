name: semgrep-audit

# Kostenloser automatischer Sicherheits-Scan (Semgrep, https://semgrep.dev)
# bei jedem Push - ersetzt den vorherigen Strix-Workflow. Im Unterschied zu
# Strix braucht Semgrep kein LLM und verursacht keine laufenden Kosten: es
# prüft nur gegen feste, offen einsehbare Regeln (OWASP, Secrets, sprach-
# spezifische Bugs), ganz ohne Account oder API-Key.
#
# Feste Regelsätze statt "--config auto": auto geht nur mit eingeschalteten
# Metriken ("Cannot create auto config when metrics are off", Exit-Code 2),
# die Metriken bleiben aber aus. p/default deckt die gängigen Sicherheits- und
# Fehlermuster ab, p/secrets sucht nach eingecheckten Zugangsdaten. Schlägt
# NICHT bei Funden fehl (kein --error) - die Funde stehen im Workflow-Log.
# Wer das später als harten Gate will: "semgrep scan --config p/default --error".

on:
  push:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep-Scan
        run: semgrep scan --config p/default --config p/secrets --metrics=off
